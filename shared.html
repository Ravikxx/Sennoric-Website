<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/assets/storage-migrate.js"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared chat — Sennoric</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/theme-dark.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.5; font-size: 14px;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
    }
    .bar-logo { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .bar-logo span { color: var(--accent); }
    .bar-note { font-size: 12.5px; color: var(--muted); }

    .wrap { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 24px 20px 120px; }
    .chat-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .chat-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 24px; }

    .msg { margin-bottom: 18px; }
    .msg-role { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .msg-body { white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; }
    .msg.assistant .msg-body { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }

    .empty, .error { text-align: center; color: var(--muted); padding: 60px 20px; }

    .cta {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; justify-content: center; padding: 16px 20px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .cta-inner {
      width: 100%; max-width: 760px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 12px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .cta-copy { font-size: 13px; color: var(--muted); }
    .btn { padding: 9px 16px; border-radius: 8px; border: 0; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="bar-logo" href="/"><span>A</span>xion</a>
    <span class="bar-note">Shared conversation</span>
  </div>
  <div class="wrap" id="wrap">
    <div class="empty">Loading…</div>
  </div>
  <div class="cta" id="cta" style="display:none">
    <div class="cta-inner">
      <span class="cta-copy" id="cta-copy"></span>
      <button type="button" class="btn btn-primary" id="cta-btn"></button>
    </div>
  </div>

<script>
  const API = 'https://api.sennoric.com'
  const params = new URLSearchParams(location.search)
  const token = params.get('t') || ''
  const sessionToken = localStorage.getItem('sennoric_token') || null

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  function renderError(message) {
    document.getElementById('wrap').innerHTML = `<div class="error">${escHtml(message)}</div>`
  }

  function renderShared(data) {
    const wrap = document.getElementById('wrap')
    const meta = data.mode === 'live' ? 'Live — reflects the latest changes' : 'Snapshot — preserved at the time it was shared'
    wrap.innerHTML = `
      <div class="chat-title">${escHtml(data.title || 'Shared chat')}</div>
      <div class="chat-meta">${escHtml(meta)}</div>
      ${(data.messages || []).map(m => `
        <div class="msg ${m.role === 'assistant' ? 'assistant' : ''}">
          <div class="msg-role">${escHtml(m.role || 'message')}</div>
          <div class="msg-body">${escHtml(m.content || '')}</div>
        </div>`).join('') || '<div class="empty">This conversation has no messages yet.</div>'}
    `
  }

  function showCta() {
    const cta = document.getElementById('cta')
    const copy = document.getElementById('cta-copy')
    const btn = document.getElementById('cta-btn')
    cta.style.display = ''
    if (sessionToken) {
      copy.textContent = 'Continue this chat as your own, independent copy.'
      btn.textContent = 'Continue chat'
      btn.onclick = continueShare
    } else {
      copy.textContent = 'Sign in to continue this chat as your own.'
      btn.textContent = 'Sign in'
      btn.onclick = () => { location.href = '/chat.html' }
    }
  }

  async function continueShare() {
    const btn = document.getElementById('cta-btn')
    btn.disabled = true
    btn.textContent = 'Continuing…'
    try {
      const controller = new AbortController()
      const timeout = setTimeout(() => controller.abort(), 10000)
      const res = await fetch(`${API}/shared/${encodeURIComponent(token)}/continue`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${sessionToken}` },
        signal: controller.signal,
      })
      clearTimeout(timeout)
      if (!res.ok) throw new Error('continue failed')
      const data = await res.json()
      location.href = `/chat.html#openChat=${encodeURIComponent(data.id)}`
    } catch {
      btn.disabled = false
      btn.textContent = 'Continue chat'
    }
  }

  ;(async function init() {
    if (!token) { renderError('This link is missing a share token.'); return }
    try {
      const controller = new AbortController()
      const timeout = setTimeout(() => controller.abort(), 10000)
      const res = await fetch(`${API}/shared/${encodeURIComponent(token)}`, { signal: controller.signal })
      clearTimeout(timeout)
      if (!res.ok) { renderError('This link is no longer available.'); return }
      const data = await res.json()
      renderShared(data)
      showCta()
    } catch {
      renderError('Could not load this shared chat. Check your connection and try again.')
    }
  })()
</script>
</body>
</html>
